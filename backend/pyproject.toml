[project]
name = "sti-ga-backend"
version = "0.1.0"
description = "Backend FastAPI del Sistema Tutor Inteligente para la Generalización Algebraica (STI-GA)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "pydantic>=2.7,<3.0",
  "pydantic-settings>=2.3,<3.0",
  "email-validator>=2.1,<3.0",
  "sqlalchemy[asyncio]>=2.0.30,<3.0",
  "psycopg[binary,pool]>=3.2,<4.0",
  "alembic>=1.13,<2.0",
  "structlog>=24.1,<27.0",
  "argon2-cffi>=23.1,<26.0",
  "pyjwt>=2.8,<3.0",
  "slowapi>=0.1.9,<0.2",
  "python-multipart>=0.0.9,<0.1",
  "openpyxl>=3.1,<4.0",
  "fpdf2>=2.7,<3.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2,<10.0",
  "pytest-asyncio>=0.23,<2.0",
  "httpx>=0.27,<1.0",
  "ruff>=0.5,<1.0",
  "mypy>=1.10,<3.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
testpaths = ["tests"]
addopts = "-p no:logging --tb=short"
filterwarnings = ["error::DeprecationWarning:app.*"]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["app", "tests", "alembic"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "S", "ASYNC", "RUF"]
ignore = ["S101", "RUF012", "B008", "RUF001", "RUF002", "RUF003"]  # B008: patrón estándar de FastAPI (Query/Depends en defaults)

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "ASYNC"]
"alembic/*" = ["N999", "E501"]
"app/seed/*" = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
files = ["app"]
ignore_missing_imports = true
